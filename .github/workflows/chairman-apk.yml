name: SNMSIS Chairman APK
on:
  push:
    branches: [main]
    paths:
      - 'school/android/**'
      - 'school/img/chairman-512.png'
      - '.github/workflows/chairman-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chairman-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use the school's existing icon
        run: |
          mkdir -p school/android/app/src/main/res/drawable
          cp school/img/chairman-512.png school/android/app/src/main/res/drawable/app_icon.png
      - name: Build and check Android app
        working-directory: school/android
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Verify APK and signature
        run: |
          cp school/android/app/build/outputs/apk/debug/app-debug.apk snmsis-chairman.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose snmsis-chairman.apk
          "$BUILD_TOOLS/aapt" dump badging snmsis-chairman.apk > apk-info.txt
          head -20 apk-info.txt
          sha256sum snmsis-chairman.apk > snmsis-chairman.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: snmsis-chairman-apk
          path: |
            snmsis-chairman.apk
            snmsis-chairman.apk.sha256
          retention-days: 30
      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="chairman-android-v1"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "SNMSIS Chairman Android" --notes "Direct-install Android app for the live SNMSIS Chairman dashboard. Internet and the existing school PIN are required. First installable build with Android debug signing; not a Play Store release."
          fi
          gh release upload "$TAG" snmsis-chairman.apk snmsis-chairman.apk.sha256 --clobber
