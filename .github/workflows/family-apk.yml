name: SNMSIS Family APK
on:
  push:
    branches: [main]
    paths:
      - 'school/family-android/**'
      - 'school/img/chairman-512.png'
      - 'school/language.js'
      - '.github/jaanch/family-entry.cjs'
      - '.github/jaanch/family-design.cjs'
      - '.github/workflows/family-apk.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: family-apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use the school's existing icon
        run: |
          mkdir -p school/family-android/app/src/main/res/drawable
          cp school/img/chairman-512.png school/family-android/app/src/main/res/drawable/app_icon.png
          mkdir -p school/family-android/app/src/main/assets
          node school/family-android/prepare-assets.cjs
      - name: Check dedicated Parent and Student entry
        run: |
          npm install --prefix /tmp/family-dom --no-audit --no-fund jsdom@26.1.0
          NODE_PATH=/tmp/family-dom/node_modules node .github/jaanch/family-entry.cjs
          NODE_PATH=/tmp/family-dom/node_modules node .github/jaanch/family-design.cjs
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: snmsis-family-debug-key-v2
      - name: Build and check Android app
        working-directory: school/family-android
        run: gradle --no-daemon assembleDebug lintDebug
      - name: Verify APK and signature
        run: |
          cp school/family-android/app/build/outputs/apk/debug/app-debug.apk snmsis-family.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --verbose snmsis-family.apk
          "$BUILD_TOOLS/aapt" dump badging snmsis-family.apk > apk-info.txt
          head -20 apk-info.txt
          sha256sum snmsis-family.apk > snmsis-family.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: snmsis-family-apk
          path: |
            snmsis-family.apk
            snmsis-family.apk.sha256
          retention-days: 30
      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="family-android-v2"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "SNMSIS Student & Parents Android" --notes "Direct-install Android app for the live SNMSIS school app for students and parents. Internet and the existing school PIN are required. Version 2 with animated welcome, coloured folder tabs and redesigned family screens. Uses Android debug signing; not a Play Store release. An older differently signed Family APK may require reinstalling."
          fi
          gh release upload "$TAG" snmsis-family.apk snmsis-family.apk.sha256 --clobber
