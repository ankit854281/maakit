name: SNMSIS Family device check
on:
  workflow_run:
    workflows: ["SNMSIS Family APK"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  device:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snmsis-family-apk
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the actual APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apk/snmsis-family.apk
            adb shell am start -n com.maakit.snmsis.family/.MainActivity
            sleep 7
            adb shell screencap -p /sdcard/family-welcome.png
            adb pull /sdcard/family-welcome.png family-welcome.png
            sleep 12
            adb shell uiautomator dump /sdcard/family-login.xml
            adb pull /sdcard/family-login.xml family-login.xml
            adb shell screencap -p /sdcard/family-login.png
            adb pull /sdcard/family-login.png family-login.png
            grep -q "Small steps." family-login.xml
            grep -q "Mobile number given to the school" family-login.xml
            adb logcat -d -s AndroidRuntime:E chromium:E > family-device.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snmsis-family-device
          path: |
            family-*.png
            family-login.xml
            family-device.log
          retention-days: 14
