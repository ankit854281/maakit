name: Node API security checks
on:
  push:
    branches: [main]
    paths:
      - 'middleware/**'
      - 'controllers/**'
      - 'node-api/**'
      - 'tests/node-api/**'
      - 'docs/postgresql/task1/**'
      - 'package*.json'
      - '.github/workflows/node-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:schema
      - run: npm run test:api
