# ============================================================
#  Maakit ka संदूक़
#
#  Gaon me jo zaroori kagaz hote hain, wo sanduk me rakhe jaate
#  hain -- ghar me aag lage to bhi bach jayein.
#
#  Ye wahi karta hai. Har raat:
#    1. maakit.in se poori database ki nakal banwata hai
#    2. us nakal ko UTAAR kar GitHub par rakh deta hai
#    3. kuch gadbad ho to GitHub par issue khol deta hai
#       (khabar email aur app dono par)
#
#  UTAARNA KYUN ZAROORI HAI
#  ------------------------
#  nakal.php nakal banata hai, par use USI HOSTING par rakhta hai.
#  Wo bhi zaroori hai -- galat SQL ya kisi ki galti se bachne ke
#  liye kaafi hai.
#
#  Par agar hosting hi chali gayi -- bill na bhara, account band,
#  server kharab -- to nakal bhi usi ke saath chali jayegi.
#
#  ASLI NAKAL WO HAI JO DOOSRI JAGAH RAKHI HO.
#
#  Isliye ye bot nakal ko utaar kar GitHub par rakh deta hai.
#  Wahan wo 90 din rehti hai, aur hosting se uska koi rishta nahi.
#
#  WEBSITE TOOT JAYE TO 2 DIN ME DOBARA BAN JAYEGI.
#  GRAAHAK KA DATA GAYA TO KAHIN SE WAPAS NAHI AAYEGA.
#
#  CHALNE KE LIYE KYA CHAHIYE
#  --------------------------
#  GitHub > Settings > Secrets and variables > Actions me:
#     MUNEEM_KEY  — wahi chaabi jo config.php me likhi hai
#     MAAKIT_URL  — https://maakit.in  (na dein to yahi maan lega)
#
#  Ye wahi chaabi hai jo muneem istemal karta hai. Nayi nahi
#  banani.
#
#  Ye kuch BADALTA NAHI -- sirf padh kar nakal rakhta hai.
# ============================================================
name: संदूक़

on:
  schedule:
    # Roz raat 2:20 (Bharat ka samay) = 20:50 UTC pichhle din.
    # Raat isliye ki us waqt koi order nahi chal raha hota, aur
    # nakal lete waqt database par bojh padta hai.
    - cron: '50 20 * * *'
  workflow_dispatch:        # haath se bhi chala sakte hain

permissions:
  contents: read
  issues: write

concurrency:
  group: sanduk
  cancel-in-progress: false

jobs:
  nakal:
    runs-on: ubuntu-latest
    steps:
      - name: नक़ल बनवाइए और उतारिए
        id: nakal
        env:
          KEY: ${{ secrets.MUNEEM_KEY }}
          URL: ${{ secrets.MAAKIT_URL }}
        run: |
          set -uo pipefail
          GHAR="${URL:-https://maakit.in}"
          GHAR="${GHAR%/}"

          if [ -z "${KEY}" ]; then
            echo "galti=MUNEEM_KEY नहीं दी गई — GitHub के Secrets में डालिए" >> "$GITHUB_OUTPUT"
            echo "theek=nahi" >> "$GITHUB_OUTPUT"; exit 0
          fi

          mkdir -p sanduk

          # ---- 1. nakal banwaiye ----
          # --fail-with-body: HTTP galti par bhi jawab padh sakein,
          # taaki issue me asli wajah likhi ja sake.
          code=$(curl -sS --max-time 300 --retry 2 --retry-delay 20 \
                      -o sanduk/jawab.json -w '%{http_code}' \
                      --fail-with-body "$GHAR/nakal.php?key=$KEY" || true)

          if [ "$code" != "200" ]; then
            echo "galti=नक़ल बनाने की कोशिश पर HTTP $code आया" >> "$GITHUB_OUTPUT"
            echo "theek=nahi" >> "$GITHUB_OUTPUT"; exit 0
          fi

          theek=$(python3 -c "import json;print(json.load(open('sanduk/jawab.json')).get('theek'))" 2>/dev/null || echo "False")
          if [ "$theek" != "True" ]; then
            wajah=$(python3 -c "import json;print(json.load(open('sanduk/jawab.json')).get('galti') or 'पता नहीं')" 2>/dev/null || echo "जवाब पढ़ा नहीं गया")
            echo "galti=नक़ल बनी नहीं — $wajah" >> "$GITHUB_OUTPUT"
            echo "theek=nahi" >> "$GITHUB_OUTPUT"; exit 0
          fi

          naam=$(python3 -c "import json;print(json.load(open('sanduk/jawab.json'))['nakal']['naam'])" 2>/dev/null || echo "")
          if [ -z "$naam" ]; then
            echo "galti=नक़ल का नाम नहीं मिला" >> "$GITHUB_OUTPUT"
            echo "theek=nahi" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rm -f sanduk/jawab.json

          # ---- 2. utaariye ----
          # Chaabi yahan BHI zaroori hai. nakal.php pehle darwaza
          # jaanchta hai, phir ?get= dekhta hai -- bina chaabi ke
          # 403 aata hai aur galti ka panna "nakal" ban kar utar
          # aata hai. (Ye jaanch me hi pakda gaya.)
          code=$(curl -sS --max-time 600 --retry 2 --retry-delay 20 \
                      -o "sanduk/$naam" -w '%{http_code}' \
                      --fail-with-body "$GHAR/nakal.php?get=$naam&key=$KEY" || true)

          if [ "$code" != "200" ] || [ ! -s "sanduk/$naam" ]; then
            echo "galti=नक़ल बनी, पर उतर नहीं पाई (HTTP $code)" >> "$GITHUB_OUTPUT"
            echo "theek=nahi" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # ---- 3. jaanch: file sach me nakal hai ya galti ka panna ----
          # Bina iske ek "403 Forbidden" wala HTML panna bhi "nakal"
          # ban kar 90 din tak sambhal kar rakha jata -- aur jis din
          # zaroorat padti, us din pata chalta.
          if ! gzip -t "sanduk/$naam" 2>/dev/null; then
            echo "galti=जो फ़ाइल उतरी वो सही नक़ल नहीं है (gzip टूटी हुई)" >> "$GITHUB_OUTPUT"
            echo "theek=nahi" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! gzip -dc "sanduk/$naam" | head -c 4000 | grep -qi "CREATE TABLE"; then
            echo "galti=नक़ल के अंदर कोई table नहीं मिली — खाली नक़ल है" >> "$GITHUB_OUTPUT"
            echo "theek=nahi" >> "$GITHUB_OUTPUT"; exit 0
          fi

          baje=$(du -h "sanduk/$naam" | cut -f1)
          lines=$(gzip -dc "sanduk/$naam" | grep -c "CREATE TABLE" || echo 0)
          echo "theek=haan" >> "$GITHUB_OUTPUT"
          echo "naam=$naam" >> "$GITHUB_OUTPUT"
          echo "baje=$baje" >> "$GITHUB_OUTPUT"
          echo "tables=$lines" >> "$GITHUB_OUTPUT"
          echo "✅ नक़ल उतर गई — $naam ($baje, $lines table)"

      - name: संदूक़ में रखिए
        if: steps.nakal.outputs.theek == 'haan'
        uses: actions/upload-artifact@v4
        with:
          name: nakal-${{ steps.nakal.outputs.naam }}
          path: sanduk/*.sql.gz
          retention-days: 90
          if-no-files-found: error

      - name: कुछ गड़बड़ हो तो बताइए
        if: steps.nakal.outputs.theek != 'haan'
        uses: actions/github-script@v7
        with:
          script: |
            // Chowkidar jaisa hi tareeka: ek hi issue khula rehta
            // hai. Roz naya issue kholne se inbox bhar jata aur
            // Ankit sab dekhna band kar deta.
            const owner = context.repo.owner, repo = context.repo.repo;
            const title = '🔒 संदूक़ — नक़ल नहीं बन पाई';
            const galti = `${{ toJSON(steps.nakal.outputs.galti) }}`;
            const kab = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
            const baat = [
              `**${kab}** को नक़ल नहीं बन पाई।`, '',
              `**वजह:** ${galti}`, '',
              '**क्यों ज़रूरी है:** वेबसाइट टूट जाए तो 2 दिन में दोबारा बन जाएगी।',
              'ग्राहक का डेटा गया तो कहीं से वापस नहीं आएगा।', '',
              '**क्या देखिए:**',
              '1. `MUNEEM_KEY` GitHub के Secrets में सही है?',
              '2. maakit.in खुल रहा है?',
              '3. hosting पर जगह बची है?',
            ].join('\\n');

            const { data: khule } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'sanduk', per_page: 10 });
            if (khule.length) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: khule[0].number, body: baat });
            } else {
              await github.rest.issues.create({
                owner, repo, title, body: baat, labels: ['sanduk'] });
            }

      - name: ठीक हो गया तो पुराना issue बंद कीजिए
        if: steps.nakal.outputs.theek == 'haan'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const { data: khule } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'sanduk', per_page: 10 });
            for (const i of khule) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: i.number,
                body: `✅ नक़ल फिर से बनने लगी — \`${{ steps.nakal.outputs.naam }}\` (${{ steps.nakal.outputs.baje }}, ${{ steps.nakal.outputs.tables }} table)` });
              await github.rest.issues.update({ owner, repo, issue_number: i.number, state: 'closed' });
            }
