name: Smart Sarathi identity
on:
  push:
    paths: ['smartsarathi/**', 'firebase/sms-guard/**', 'tests/sarathi-*', '.github/workflows/sarathi-identity.yml']
  pull_request:
    paths: ['smartsarathi/**', 'firebase/sms-guard/**', 'tests/sarathi-*', '.github/workflows/sarathi-identity.yml']
  workflow_dispatch:
jobs:
  identity:
    runs-on: ubuntu-latest
    services:
      db:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: identity-ci
          MARIADB_DATABASE: sarathi_identity_test
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, gd, openssl
          coverage: none
      - name: PHP and JavaScript syntax
        run: |
          find smartsarathi -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check smartsarathi/assets/firebase-login.js
          node --check smartsarathi/assets/customer.js
      - name: Token security and identity integration
        env:
          SR_TEST_DB_HOST: 127.0.0.1
          SR_TEST_DB_PASSWORD: identity-ci
        run: |
          php -d auto_prepend_file=tests/ci-annotate.php tests/sarathi-firebase.php
          php -d auto_prepend_file=tests/ci-annotate.php tests/sarathi-identity-flow.php
          php -d auto_prepend_file=tests/ci-annotate.php tests/sarathi-rider-flow.php
          php -d auto_prepend_file=tests/ci-annotate.php tests/sarathi-booking.php
          php -d auto_prepend_file=tests/ci-annotate.php tests/sarathi-docs.php
          php -d auto_prepend_file=tests/ci-annotate.php tests/sarathi-e2e.php
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SMS guard dependency and unit checks
        working-directory: firebase/sms-guard/functions
        run: |
          npm ci --ignore-scripts
          npm test
          node -e "require('./index.js')"

      - name: Mobile pages at 360px and 390px
        env:
          SR_TEST_DB_HOST: 127.0.0.1
          SR_TEST_DB_PASSWORD: identity-ci
        run: |
          npm install --prefix /tmp/sarathi-browser --no-audit --no-fund playwright@1.51.1
          /tmp/sarathi-browser/node_modules/.bin/playwright install --with-deps chromium
          php tests/sarathi-mobile-fixture.php
          php -S 127.0.0.1:8098 -t "$(cat /tmp/sarathi-mobile-root)" >/tmp/sarathi-mobile-server.log 2>&1 &
          NODE_PATH=/tmp/sarathi-browser/node_modules node tests/sarathi-mobile.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sarathi-mobile-results
          path: |
            /tmp/sarathi-mobile-shots
            /tmp/sarathi-mobile-server.log
