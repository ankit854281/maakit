name: SNMSIS Teacher APK on Maakit domain
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/teacher-apk-domain.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: teacher-apk-domain
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download the published APK and verify its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/teacher-apk-release school/downloads
          gh release download teacher-android-v1 --dir /tmp/teacher-apk-release --pattern snmsis-teacher.apk --pattern snmsis-teacher.apk.sha256
          (cd /tmp/teacher-apk-release && sha256sum --check snmsis-teacher.apk.sha256)
          test "$(stat -c %s /tmp/teacher-apk-release/snmsis-teacher.apk)" -gt 1000000
          cp /tmp/teacher-apk-release/snmsis-teacher.apk school/downloads/snmsis-teacher.apk
      - name: Commit the APK to main without discarding other work
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f school/downloads/snmsis-teacher.apk
          if git diff --cached --quiet; then
            echo "Website APK is already current"
            exit 0
          fi
          git commit -m "Host verified SNMSIS Teacher APK on Maakit domain; remove nothing"
          git pull --rebase origin main
          git push origin HEAD:main
