plugins {
    id 'com.android.application'
}

android {
    namespace 'com.maakit.trial'
    compileSdk 34

    defaultConfig {
        applicationId 'com.maakit.trial'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1-trial'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
