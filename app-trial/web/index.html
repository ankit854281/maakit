<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#F2600F">
<title>Maakit Trial App</title>
<style>
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Poppins;src:url(fonts/poppins-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
/* Layout: reference-style service app. Header colour belongs to the chosen service tab; everything below is white and quiet. */
:root{
  --ink:#1F1F24;--muted:#7A7A85;--faint:#A9A9B3;--line:#EFEFF3;--bg:#F7F7F9;--card:#FFFFFF;
  --a:#F2600F;--a2:#FF7A2F;--soft:#FFE9DC;--tint:#FFF3EB;--hshadow:rgba(242,96,15,.25);
  --brand:#D6246E;--brand2:#A3164F;
  --ok:#1E9E5A;--okbg:#E8F6EE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#16121A}
body{font-family:Poppins,'Noto Sans Devanagari','Mangal',system-ui,sans-serif;color:var(--ink);font-size:13.5px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
input,textarea{font-family:inherit;color:var(--ink)}
a{color:inherit;text-decoration:none}
#phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--bg)}
@media (min-width:520px){
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(60% 60% at 20% 10%,#3A2A40 0%,transparent 70%),#16121A}
  #phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 11px #0B090D,0 0 0 13px #34303A,0 40px 90px rgba(0,0,0,.55)}
}
#app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.ill{display:block}
svg.i{width:18px;height:18px;flex-shrink:0}

/* ---------- home header ---------- */
.head{position:relative;color:#fff;border-radius:0 0 22px 22px;overflow:hidden;flex-shrink:0;z-index:3;box-shadow:0 8px 24px var(--hshadow);transition:box-shadow .5s}
.hb{position:absolute;inset:0;transition:opacity .55s ease}
.loc{position:relative;display:flex;align-items:center;gap:10px;padding:38px 16px 8px}
.loc .w{flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;color:#fff}
.loc .w small{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:500;opacity:.95}
.loc .w span{display:block;font-size:11.5px;opacity:.78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.loc .w small span{display:inline;margin:0;opacity:1}
.trialtag{font-size:9px;font-weight:600;letter-spacing:.06em;background:rgba(255,255,255,.22);padding:1px 6px;border-radius:6px}
.av{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:4px 10px 0}
.fold{position:absolute;left:0;top:0;bottom:0;width:25%;background:rgba(255,255,255,.2);border-radius:16px 16px 0 0;transition:transform .5s cubic-bezier(.22,1,.36,1)}
.fold::before,.fold::after{content:"";position:absolute;bottom:0;width:14px;height:14px}
.fold::before{left:-14px;background:radial-gradient(circle at 0 0,transparent 13.5px,rgba(255,255,255,.2) 14px)}
.fold::after{right:-14px;background:radial-gradient(circle at 100% 0,transparent 13.5px,rgba(255,255,255,.2) 14px)}
.tab{position:relative;z-index:1;border:0;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 8px;font-size:10.5px;font-weight:500;line-height:1.2;opacity:.92;transition:opacity .3s}
.tab .ill{width:38px;height:38px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.tab.on{opacity:1;font-weight:600}
.tab.on .ill{transform:translateY(-2px) scale(1.08)}
.strip{position:relative;background:rgba(255,255,255,.2);padding:10px 12px 13px;display:flex;gap:8px;align-items:center}
.sbox{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;height:38px;padding:0 12px;color:var(--faint);box-shadow:0 2px 6px rgba(0,0,0,.06)}
.sbox input{flex:1;min-width:0;border:0;outline:0;font-size:12.5px;background:transparent}
.veg{display:flex;align-items:center;gap:4px;height:30px;padding:0 8px 0 4px;border-radius:999px;background:rgba(255,255,255,.88);font-size:9.5px;font-weight:700;color:#8A8A95;border:0}
.veg i{width:22px;height:22px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pagebg{position:absolute;left:0;right:0;top:0;height:420px;pointer-events:none;transition:opacity .55s ease}

/* ---------- body ---------- */
.body{position:relative;padding:14px 14px 110px;display:flex;flex-direction:column;gap:14px;transition:opacity .22s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.body.out-l{opacity:0;transform:translateX(-18px)}
.body.out-r{opacity:0;transform:translateX(18px)}
h2{margin:0;font-size:15px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--muted);font-size:12px}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 12px rgba(20,20,30,.05)}
.promo{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:linear-gradient(100deg,var(--soft),#fff);border:1px solid var(--soft)}
.promo b{display:block;font-size:13.5px;font-weight:600;color:var(--a)}
.promo span{font-size:11.5px;color:var(--muted);line-height:1.4}
.promo .ill{width:52px;height:52px;flex-shrink:0}
.hscroll{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px}
.hscroll::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;width:66px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:500;text-align:center;line-height:1.2}
.cat>span{width:58px;height:58px;border-radius:50%;background:#F1F1F4;display:flex;align-items:center;justify-content:center;border:2px solid transparent;transition:border-color .2s}
.cat .ill{width:46px;height:46px}
.cat.on>span{border-color:var(--a);background:var(--tint)}
.cat.on{color:var(--a);font-weight:600}
.rest{display:block;width:100%;border:0;padding:0;background:none;text-align:left}
.cover{position:relative;height:150px;border-radius:14px;overflow:hidden}
.cover svg.cv{position:absolute;inset:0;width:100%;height:100%}
.cover .cap{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:2px;padding:30px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.62));color:#fff}
.cover .cap b{display:block;font-size:15px;font-weight:600}
.cover .cap span{display:flex;align-items:center;gap:4px;font-size:11px;opacity:.9}
.tiles{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px 4px}
.tiles::-webkit-scrollbar{display:none}
.tile{flex-shrink:0;width:96px}
.tile .im{position:relative;width:96px;height:96px;border-radius:12px;background:#F4F4F6;display:flex;align-items:center;justify-content:center}
.tile .im .ill{width:80px;height:80px}
.tile .vg{position:absolute;left:6px;top:6px;width:12px;height:12px;border:1.5px solid var(--ok);border-radius:2px;display:flex;align-items:center;justify-content:center;background:#fff}
.tile .vg::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ok)}
.tile .addw{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%)}
.tile b{display:block;margin-top:14px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile small{font-size:12px;color:var(--ink);font-weight:600}
.add{min-width:62px;height:28px;border-radius:8px;border:1px solid var(--soft);background:#fff;color:var(--a);font-size:12.5px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08);padding:0 10px}
.step{display:flex;align-items:center;justify-content:space-between;min-width:72px;height:28px;border-radius:8px;background:#fff;border:1px solid var(--soft);box-shadow:0 2px 6px rgba(0,0,0,.08);color:var(--a);font-weight:600;font-size:13px}
.step button{width:24px;height:26px;border:0;background:none;color:var(--a);font-size:16px;padding:0}
.shopcard{overflow:hidden}
.shopcard .cover{border-radius:14px 14px 0 0;height:140px}
.shopcard .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
.open{font-size:10px;font-weight:600;color:var(--ok);background:var(--okbg);padding:2px 8px;border-radius:6px;white-space:nowrap}
.clock{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:6px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pill{display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:12px;border:0;font-size:12.5px;font-weight:500}
.pill.solid{background:linear-gradient(180deg,var(--a2),var(--a));color:#fff;box-shadow:0 4px 10px var(--hshadow)}
.pill.soft{background:var(--soft);color:var(--a)}
.pill.line{background:#fff;border:1px solid #E6E6EC;color:var(--ink)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:48px;border-radius:999px;border:0;background:linear-gradient(180deg,var(--a2),var(--a));color:#fff;font-size:14.5px;font-weight:500;box-shadow:0 6px 16px var(--hshadow)}
.cta[disabled]{opacity:.45;box-shadow:none}
.cartbar{position:absolute;left:12px;right:12px;bottom:16px;z-index:30;display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;height:52px;border-radius:14px;border:0;background:linear-gradient(180deg,var(--a2),var(--a));color:#fff;box-shadow:0 8px 20px var(--hshadow);animation:rise .3s ease}
.cartbar b{flex:1;text-align:left;font-size:13.5px;font-weight:500}
.cartbar em{font-style:normal;font-size:13px;font-weight:500}
.cartbar .x{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.form{padding:14px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.inp{display:flex;align-items:center;gap:10px;min-height:46px;border:1px solid #E7E7EE;border-radius:12px;padding:0 12px;background:#fff}
.inp input,.inp textarea{flex:1;min-width:0;border:0;outline:0;font-size:13.5px;background:transparent;resize:none}
.inp textarea{padding:10px 0;min-height:64px}
.inp:focus-within{border-color:var(--a)}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;border:1px solid #E7E7EE;background:#fff;font-size:12px}
.chip.on{border-color:var(--a);background:var(--tint);color:var(--a);font-weight:600}
.chip .ill{width:24px;height:24px}
.veh{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.veh button{border:1px solid #E7E7EE;background:#fff;border-radius:14px;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:500}
.veh button .ill{width:56px;height:56px}
.veh button small{font-size:10.5px;color:var(--muted);font-weight:400}
.veh button.on{border-color:var(--a);background:var(--tint)}
.note{display:flex;gap:8px;align-items:flex-start;font-size:11.5px;color:var(--muted);line-height:1.45}
.note svg{color:var(--a);margin-top:1px}
.scard{position:relative;border-radius:16px;overflow:hidden;height:220px;background:#fff}
.scard svg.scene{position:absolute;inset:0;width:100%;height:100%}
.scard .t{position:relative;padding:14px 16px}
.scard .t b{display:block;font-size:16px;font-weight:600}
.scard .t span{font-size:11.5px;color:var(--muted)}
.foot{text-align:center;font-size:10.5px;color:var(--faint);padding:4px 0}

/* ---------- plain top bar (inner pages) ---------- */
.tbar{display:flex;align-items:center;gap:10px;padding:38px 12px 10px;background:#fff;flex-shrink:0;border-bottom:1px solid var(--line)}
.tbar .bk{width:36px;height:36px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center}
.tbar b{display:block;font-size:14.5px;font-weight:600}
.tbar span{font-size:11.5px;color:var(--muted)}
.line1{display:flex;align-items:center;gap:10px;padding:12px 14px}
.line1+.line1{border-top:1px solid var(--line)}
.vg2{width:13px;height:13px;border:1.5px solid var(--ok);border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vg2::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--ok)}
.sum{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:5px 0}
.sum.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:13.5px;font-weight:600}
.rad{display:flex;align-items:center;gap:12px;padding:14px;border:0;background:none;width:100%;text-align:left;font-size:13.5px}
.rad+.rad{border-top:1px solid var(--line)}
.rad i{width:20px;height:20px;border-radius:50%;border:2px solid #CFCFD8;flex-shrink:0}
.rad.on i{border:6px solid var(--a)}
.bottombar{padding:12px 14px 22px;background:#fff;border-top:1px solid var(--line);flex-shrink:0}

/* ---------- login ---------- */
.band{position:relative;height:250px;flex-shrink:0;background:radial-gradient(90% 120% at 90% 0%,rgba(255,176,32,.28) 0%,transparent 60%),linear-gradient(170deg,#E3417F 0%,#D6246E 45%,#A3164F 100%);display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden}
.band .wm{display:flex;align-items:center;gap:12px;font-size:44px;font-weight:700;letter-spacing:-1px;margin-top:-26px}
.band .wm svg{width:58px;height:58px;background:#fff;border-radius:16px;padding:5px}
.band .lang{position:absolute;top:36px;right:14px;display:flex;background:rgba(255,255,255,.2);border-radius:999px;padding:3px}
.band .lang button{border:0;background:none;color:#fff;font-size:11px;font-weight:600;padding:5px 10px;border-radius:999px}
.band .lang button.on{background:#fff;color:var(--brand)}
.band .orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.sheetw{position:relative;margin-top:-26px;background:#fff;border-radius:24px 24px 0 0;flex:1;padding:24px 20px 20px;display:flex;flex-direction:column;gap:14px}
.sheetw h1{margin:0;font-size:19px;font-weight:500}
.ph{display:flex;align-items:center;height:50px;border:1px solid #E7E7EE;border-radius:12px;overflow:hidden}
.ph span{padding:0 12px;font-size:14px;border-right:1px solid #E7E7EE;height:100%;display:flex;align-items:center;gap:4px}
.ph input{flex:1;min-width:0;border:0;outline:0;font-size:15px;padding:0 12px;letter-spacing:.04em}
.ph:focus-within{border-color:var(--brand)}
.chk{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);border:0;background:none;padding:0;text-align:left}
.chk i{width:18px;height:18px;border-radius:4px;border:1.5px solid #9C9CA8;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.chk.on i{background:var(--brand);border-color:var(--brand)}
.chk u{color:var(--brand);text-decoration:underline}
.brandbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:999px;border:0;background:linear-gradient(180deg,#E3417F,#C81F64);color:#fff;font-size:14.5px;font-weight:500;box-shadow:0 6px 16px rgba(200,31,100,.25)}
.brandbtn[disabled]{opacity:.4;box-shadow:none}
.otp{display:flex;gap:12px}
.otp input{width:58px;height:54px;text-align:center;font-size:22px;font-weight:600;border:1px solid #E7E7EE;border-radius:12px;outline:0}
.otp input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(214,36,110,.12)}
.ver{margin-top:auto;text-align:center;font-size:11px;color:var(--faint)}

/* ---------- map / track ---------- */
.map{position:relative;flex-shrink:0;background:#EEF1EA;overflow:hidden}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.map .ctl{position:absolute;top:38px;left:12px;right:12px;display:flex;gap:10px;align-items:center;z-index:2}
.map .ctl .bk{width:38px;height:38px;border-radius:50%;border:0;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.12);flex-shrink:0}
.map .ctl .ttl{background:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.tip{position:absolute;left:50%;transform:translateX(-50%);background:#1F1F24;color:#fff;font-size:11px;padding:6px 10px;border-radius:8px;white-space:nowrap}
.tsheet{position:relative;margin-top:-22px;background:#fff;border-radius:22px 22px 0 0;padding:10px 14px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.grab{display:block;margin:0 auto;width:40px;height:4px;border-radius:2px;background:#E1E1E8}
.steps{display:flex;align-items:flex-start}
.steps div{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;font-size:10px;text-align:center;line-height:1.25;color:var(--faint)}
.steps div::before{content:"";position:absolute;top:10px;left:50%;width:100%;height:3px;background:#ECECF1}
.steps div:last-child::before{display:none}
.steps div.done::before{background:var(--ok)}
.steps i{position:relative;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid #E1E1E8;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:11px;font-weight:700}
.steps .done i{background:var(--ok);border-color:var(--ok)}
.steps .now i{background:var(--a);border-color:var(--soft);animation:pulse 1.2s infinite}
.steps .done,.steps .now{color:var(--ink);font-weight:500}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--soft)}}
.code{display:flex;gap:6px}
.code span{width:32px;height:38px;border-radius:9px;background:var(--tint);border:1px solid var(--soft);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:var(--a)}

/* ---------- sheet / toast / profile ---------- */
.ov{position:absolute;inset:0;z-index:50;background:rgba(20,16,24,.45);display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-height:90%;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px 24px;animation:up .28s cubic-bezier(.2,.8,.2,1);position:relative}
.sheet .x{position:absolute;right:14px;top:12px;width:32px;height:32px;border-radius:50%;border:0;background:#F3F3F6;display:flex;align-items:center;justify-content:center}
@keyframes up{from{transform:translateY(60%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:70;background:rgba(31,31,36,.92);color:#fff;font-size:12px;padding:9px 14px;border-radius:10px;max-width:86%;text-align:center;animation:fade .2s}
.prof{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:linear-gradient(100deg,var(--soft),#fff);border:1px solid var(--soft)}
.prof .pa{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--a);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.mi{display:flex;align-items:center;gap:12px;padding:14px;border:0;background:none;width:100%;text-align:left;font-size:13.5px}
.mi+.mi{border-top:1px solid var(--line)}
.mi .ic{width:34px;height:34px;border-radius:10px;background:#F4F4F7;display:flex;align-items:center;justify-content:center;color:#55555F}
.seg{display:flex;background:#F1F1F5;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--muted)}

.empty .ill{width:110px;height:110px}

var trT=null;
function tick(id){ clearInterval(trT); var path=document.getElementById('rt'); if(!path) return; var o=findOrder(id); if(!o) return; var len=path.getTotalLength();
  function u(){ var t=T(), st=stepOf(o), el=Date.now()-o.t0, p=st<3?0:st>=4?1:Math.min(1,(el-18000)/6000), pt=path.getPointAtLength(len*p);
    var r=document.getElementById('rider'); if(!r){ clearInterval(trT); return; } r.setAttribute('transform','translate('+pt.x.toFixed(1)+' '+pt.y.toFixed(1)+')');
    var ds=document.querySelectorAll('#steps div'); for(var k=0;k<ds.length;k++){ ds[k].className=(k<st||st===4)?'done':(k===st?'now':''); ds[k].querySelector('i').textContent=(k<st||st===4)?'✓':''; }
    document.getElementById('tv').textContent=st===4?t.deliveredW:Math.max(1,Math.round(30-30*(el/24000)))+' '+t.minutes;
    document.getElementById('tk').style.visibility=st===4?'hidden':'visible';
    document.getElementById('ts').textContent=t.steps[o.type][st];
    if(st===4) clearInterval(trT); }
  u(); trT=setInterval(u,300); }

function render(keep){

  clearInterval(trT); document.documentElement.lang=S.lang;

  switch(p[0]){

var rsT=null;
function bind(){
  var ph=document.getElementById('ph');
  if(ph) ph.addEventListener('input',function(){ ph.value=ph.value.replace(/\D/g,'').slice(0,10); S.phone=ph.value; save(); document.getElementById('send').disabled=!(S.phone.length===10&&S.agree); });
  var os=document.querySelectorAll('[data-otp]');
  if(os.length){ os[0].focus(); for(var i=0;i<os.length;i++)(function(i){
    os[i].addEventListener('input',function(){ os[i].value=os[i].value.replace(/\D/g,'').slice(0,1); if(os[i].value&&os[i+1]) os[i+1].focus(); var a=''; for(var k=0;k<os.length;k++) a+=os[k].value; document.getElementById('verify').disabled=a.length!==4; });
    os[i].addEventListener('keydown',function(e){ if(e.key==='Backspace'&&!os[i].value&&os[i-1]) os[i-1].focus(); }); })(i);
    var s=59; clearInterval(rsT); rsT=setInterval(function(){ var e=document.getElementById('rs'); if(!e){clearInterval(rsT);return;} s--; e.textContent=s>0?T().resend+' 0:'+(s<10?'0':'')+s:T().resend; if(s<=0) clearInterval(rsT); },1000); }
  var hs=document.getElementById('house'); if(hs) hs.addEventListener('input',function(){ S.addr.house=hs.value; save(); });
  var n=document.getElementById('nm'); if(n) n.addEventListener('input',function(){ S.addr.name=n.value; save(); });
}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-q],[data-clear],[data-go],[data-back],[data-tab],[data-rest],[data-shop],[data-book],[data-bookgo],[data-item],[data-close],[data-fcat],[data-lang],[data-lang2],[data-agree],[data-help],[data-veh],[data-kind],[data-wt],[data-pay],[data-toast],[data-logout],#send,#verify,#saveaddr,#place,#ride,#parcel,#veg');
  if(!el) return; var d=el.dataset;
  if(d.close!==undefined && el.classList.contains('ov') && e.target!==el) return;
  if(d.q){ e.stopPropagation(); setQ(d.q,+d.d); if(route()==='home'){ refreshHome(); if(SHEET) openSheet(SHEET); } else render(true); return; }
  if(d.clear){ e.stopPropagation(); S.cart={place:null,q:{}}; save(); if(route()==='home') refreshHome(); else render(true); return; }
  if(d.close){ SHEET=null; var ov=document.querySelector('.ov'); if(ov) ov.remove(); return; }
  if(d.go){ go(d.go); return; }
  if(d.back){ if(history.length>1) history.back(); else go('home'); return; }
  if(d.tab){ switchTab(+d.tab); return; }
  if(d.rest){ go('rest-'+d.rest); return; }
  if(d.shop){ go('shop-'+d.shop); return; }
  if(d.book){ openSheet({type:'check',id:d.book}); return; }
  if(d.bookgo){ newOrder('shops',d.bookgo,0,0); return; }
  if(d.item){ openSheet({type:'item',id:d.item}); return; }
  if(d.fcat){ S.fcat=d.fcat; save(); refreshHome(); return; }
  if(d.lang){ S.lang=d.lang; save(); render(); return; }
  if(d.lang2){ S.lang=d.lang2; save(); render(true); return; }
  if(d.agree){ S.agree=!S.agree; save(); render(); return; }
  if(d.help){ var a=S.addr.helps, k=+d.help, ix=a.indexOf(k); if(ix>=0) a.splice(ix,1); else a.push(k); save(); el.classList.toggle('on'); return; }
  if(d.veh){ S.veh=+d.veh; save(); refreshHome(); return; }
  if(d.kind){ S.kind=+d.kind; save(); refreshHome(); return; }
  if(d.wt){ S.wt=+d.wt; save(); refreshHome(); return; }
  if(d.pay){ S.pay=+d.pay; save(); render(true); return; }
  if(d.toast){ openSheet({type:'msg',text:d.toast==='about'?T().aboutS:T().notifOff}); return; }
  if(d.logout){ var l=S.lang; try{localStorage.removeItem('mk_trial2');}catch(x){} S=fresh(); S.lang=l; go('login'); return; }
  if(el.id==='send'){ go('otp'); return; }
  if(el.id==='verify'){ go('where'); return; }
  if(el.id==='saveaddr'){ S.loggedIn=true; save(); toast(T().saved); go('home'); return; }
  if(el.id==='place'){ var c=S.cart, n=count(), tot=total(); S.cart={place:null,q:{}}; newOrder(c.place.charAt(0)==='r'?'food':'shops',c.place,n,tot); return; }
  if(el.id==='ride'){ newOrder('bike',null,0,0); return; }
  if(el.id==='parcel'){ newOrder('parcel',null,0,0); return; }
  if(el.id==='veg'){ el.classList.toggle('on'); el.style.background=el.classList.contains('on')?'#E8F6EE':''; return; }
});
var tx=null,ty=null;
document.addEventListener('touchstart',function(e){ if(route()!=='home'||!e.target.closest('#hbody')||e.target.closest('.hscroll,.tiles')){tx=null;return;} tx=e.touches[0].clientX; ty=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend',function(e){ if(tx===null) return; var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null; if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5){ var n=S.tab+(dx<0?1:-1); if(n>=0&&n<4) switchTab(n); } },{passive:true});

if(!location.hash) history.replaceState(null,'','#'+route());
render();
window.MK_BACK=function(){ if(SHEET){ SHEET=null; var o=document.querySelector('.ov'); if(o) o.remove(); return true; } var r=route(); if(r==='home'||r==='login') return false; history.back(); return true; };
})();
</script>
</body>
</html>
