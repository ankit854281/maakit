<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#7A1D4E">
<title>Maakit Trial App</title>
<style>
@font-face{font-family:Lexend;src:url(fonts/lexend-latin-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Lexend;src:url(fonts/lexend-latin-600.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:Lexend;src:url(fonts/lexend-latin-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:Lexend;src:url(fonts/lexend-latin-800.woff2) format('woff2');font-weight:800;font-display:swap}
:root{
  /* One calm palette (owner, 1 Nov): deep plum-magenta header, near-white page, one soft rose tint for every tile. */
  --ink:#2A1F2D;--muted:#6E6272;--line:#EEE6EC;
  --bg:#F7F5F8;--tile:#F8F1F5;
  --a:#C2205F;--deep:#8E1D52;--soft:#F8E8EF;--glow:rgba(110,24,70,.22);
  --head:radial-gradient(120% 140% at 85% 0%,rgba(229,164,71,.22) 0%,rgba(229,164,71,0) 55%),linear-gradient(160deg,#A62A62 0%,#7A1D4E 55%,#4A1236 100%);
  --strip:rgba(255,255,255,.14);
  --pagebg:#F7F5F8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1C0D1F}
body{font-family:Lexend,'Noto Sans Devanagari','Mangal',system-ui,sans-serif;color:var(--ink)}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
a{color:inherit}
#phone{position:relative;width:100%;height:100%;overflow:hidden;background:var(--pagebg)}
@media (min-width:520px){
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;
    background:radial-gradient(60% 60% at 20% 10%,#5A1D4A 0%,transparent 70%),radial-gradient(50% 60% at 90% 90%,#3B1F6E 0%,transparent 70%),#1C0D1F}
  #phone{width:390px;height:844px;border-radius:46px;box-shadow:0 0 0 11px #0E070F,0 0 0 13px #3A2A38,0 40px 90px rgba(0,0,0,.55)}
}
#app{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.trial{position:absolute;z-index:60;top:0;left:50%;transform:translateX(-50%);background:#F1CD94;color:#5A3A12;font-size:10px;font-weight:800;padding:2px 10px;border-radius:0 0 10px 10px;letter-spacing:.04em;white-space:nowrap}

/* glass */
.glass{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%)}
.glass-w{background:rgba(255,255,255,.74);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%)}

/* header */
.head{position:relative;color:#fff;background:var(--head);border-radius:0 0 30px 30px;box-shadow:0 16px 34px var(--glow);overflow:hidden;flex-shrink:0;transition:box-shadow .45s}
.head.layered{background:none}
.hb{position:absolute;inset:0;transition:opacity .5s ease;pointer-events:none}
.head .orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.1);pointer-events:none}
.top{position:relative;display:flex;align-items:center;gap:10px;padding:34px 16px 12px}
.logo{width:38px;height:38px;border-radius:12px;background:#fff;padding:3px;flex-shrink:0}
.where{flex:1;min-width:0;background:none;border:0;color:#fff;text-align:left;padding:0}
.where small{display:block;font-size:12px;opacity:.85}
.where b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.circ{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.circ svg{width:20px;height:20px}

/* folder tabs (like the reference recording) — one sliding folder */
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:4px 16px 0}
.ind{position:absolute;left:0;top:0;bottom:0;width:25%;background:var(--strip);border-radius:20px 20px 0 0;transition:transform .5s cubic-bezier(.22,1,.36,1);pointer-events:none}
.ind::before,.ind::after{content:"";position:absolute;bottom:0;width:18px;height:18px}
.ind::before{left:-18px;background:radial-gradient(circle at 0 0,transparent 17.5px,var(--strip) 18px)}
.ind::after{right:-18px;background:radial-gradient(circle at 100% 0,transparent 17.5px,var(--strip) 18px)}
.tab{position:relative;z-index:1;border:0;background:transparent;color:rgba(255,255,255,.88);padding:6px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;font-weight:600;line-height:1.15;transition:color .3s}
.tab .ill{width:46px;height:46px;filter:drop-shadow(0 5px 6px rgba(40,10,30,.22));transform:scale(.9);transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.tab.on{color:#fff;font-weight:800}
.tab.on .ill{transform:translateY(-3px) scale(1.06)}
.tab .soon{position:absolute;top:0;right:4px;background:#F1CD94;color:#5A3A12;font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px}
.ill{display:block}
.swap{transition:opacity .2s ease,transform .28s cubic-bezier(.22,1,.36,1)}
.swap.out-l{opacity:0;transform:translateX(-24px)}
.swap.out-r{opacity:0;transform:translateX(24px)}
@media (prefers-reduced-motion:reduce){.ind,.hb,.swap,.tab .ill{transition:none}}
.strip{position:relative;background:var(--strip);padding:12px 14px 16px;border-radius:0 0 30px 30px}
.search{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);border-radius:16px;padding:0 14px;height:50px;color:var(--muted);box-shadow:0 8px 20px rgba(0,0,0,.14)}
.search input{border:0;outline:0;font-size:15px;flex:1;min-width:0;background:transparent;color:var(--ink)}
.search svg{width:19px;height:19px;flex-shrink:0}
.search .sep{width:1px;height:22px;background:#EADAD2}

.bar{position:relative;display:flex;align-items:center;gap:8px;padding:34px 12px 16px}
.bar h1{margin:0;font-size:19px;font-weight:800;flex:1}
.bar .circ{width:40px;height:40px}

/* body */
.pad{padding:16px 16px 120px;display:flex;flex-direction:column;gap:16px}
h2{margin:0;font-size:18px;font-weight:800}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{border:0;background:none;color:var(--a);font-weight:700;font-size:13px;padding:4px}
.banner{position:relative;overflow:hidden;border-radius:22px;min-height:262px;color:var(--ink);background:#FFF8FA;box-shadow:0 10px 26px rgba(74,18,54,.10);border:1px solid #F3E6EC}
.banner .scene{position:absolute;inset:0;width:100%;height:100%}
.banner .txt{position:relative;padding:16px 18px 0;max-width:270px}
.banner .k{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--a)}
.banner .tt{font-size:19px;font-weight:800;line-height:1.22;margin:5px 0 4px;color:#3A1530;text-wrap:balance}
.banner .s{font-size:12.5px;color:var(--muted);line-height:1.4}
.pcard{position:relative;overflow:hidden;border-radius:22px;padding:18px;color:#fff;background:var(--head);box-shadow:0 12px 26px var(--glow);display:flex;align-items:center;gap:14px}
.pcard .bub{position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.cats{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.cats::-webkit-scrollbar{display:none}
.cat{flex-shrink:0;width:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-size:11.5px;font-weight:600;text-align:center;line-height:1.25;padding:0}
.cat span{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -6px 12px rgba(0,0,0,.05),0 6px 14px rgba(34,20,31,.08)}
.cat .ill{width:46px;height:46px}
.cat.on span{outline:3px solid var(--a);outline-offset:2px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.pill{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid #E6DCE6;background:#fff;font-size:13px;font-weight:600;color:var(--ink)}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.shopc{display:block;width:100%;text-align:left;border:0;padding:0;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 26px rgba(34,20,31,.08);color:var(--ink)}
.shopc .cv{position:relative;height:124px}
.shopc .cv svg.art{position:absolute;inset:0;width:100%;height:100%}
.badge{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.8);color:#2F6E52;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.badge i{width:7px;height:7px;border-radius:50%;background:#4E9A78}
.eta{position:absolute;right:12px;bottom:12px;background:rgba(28,13,31,.55);color:#fff;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.shopc .nm{padding:12px 14px 14px}
.shopc .nm b{display:block;font-size:16px;font-weight:800}
.shopc .nm span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{text-align:left;display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;box-shadow:0 10px 24px rgba(34,20,31,.07);color:var(--ink)}
.gcard .gi{width:64px;height:64px;border-radius:20px;background:radial-gradient(70% 70% at 40% 35%,#fff 0%,var(--tile) 100%);display:flex;align-items:center;justify-content:center}
.gcard .gi .ill{width:52px;height:52px}
.gcard b{font-size:15px;font-weight:800;display:block}
.gcard span{font-size:12px;color:var(--muted);line-height:1.35}
.note{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--soft);color:var(--deep);font-size:13px;font-weight:600;line-height:1.35}
.note svg{width:18px;height:18px;flex-shrink:0}

/* bottom nav */
.nav{position:absolute;left:12px;right:12px;bottom:14px;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 4px;border-radius:24px;box-shadow:0 14px 30px rgba(34,20,31,.16)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);padding:2px;position:relative}
.nav button span{padding:4px 14px;border-radius:999px;display:flex}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--a);font-weight:700}
.nav button.on span{background:var(--soft)}
.nav .cnt{position:absolute;top:-2px;right:16px;min-width:18px;height:18px;border-radius:9px;background:var(--a);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}

/* shop page */
.cover{position:relative;height:230px;flex-shrink:0}
.cover svg.art{position:absolute;inset:0;width:100%;height:100%}
.cover .ctl{position:absolute;top:36px;left:14px;right:14px;display:flex;justify-content:space-between}
.cover .ctl button{width:42px;height:42px;border-radius:21px;border:0;color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.cover .ctl svg{width:20px;height:20px}
.sheetpage{position:relative;margin-top:-30px;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 16px 130px;display:flex;flex-direction:column;gap:14px;min-height:calc(100% - 200px)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:#fff;border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:600;box-shadow:0 4px 12px rgba(34,20,31,.05)}
.chip svg{width:15px;height:15px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:flex;align-items:center;justify-content:center;gap:6px;height:42px;border-radius:12px;border:1px solid #EADDE8;background:#fff;font-size:13px;font-weight:700;color:var(--ink);text-decoration:none}
.act svg{width:16px;height:16px}
.act.wa{background:#EAF3EE;color:#2F6E52;border:0}
.icard{display:flex;flex-direction:column;text-align:left;border:0;padding:0;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 8px 20px rgba(34,20,31,.07);color:var(--ink)}
.icard .ph{height:104px;display:flex;align-items:center;justify-content:center}
.icard .ph .ill{width:74px;height:74px}
.icard .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.icard .in b{font-size:14px}
.icard .in small{font-size:12px;color:var(--muted)}
.icard .pr{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-weight:800;font-size:15px}
.add{font-size:13px;font-weight:700;color:var(--a);background:var(--soft);border:1px solid #F6C3D6;padding:5px 12px;border-radius:999px}
.step{display:flex;align-items:center;border-radius:999px;background:var(--a);color:#fff;font-weight:800;font-size:14px;overflow:hidden}
.step button{width:28px;height:28px;border:0;background:transparent;color:#fff;font-size:17px;font-weight:700;padding:0}
.step span{min-width:18px;text-align:center}
.cartbar{position:absolute;left:14px;right:14px;bottom:18px;z-index:25;display:flex;justify-content:space-between;align-items:center;color:#fff;border:0;border-radius:18px;padding:13px 18px;background:linear-gradient(135deg,#B23A6E 0%,#8E1D52 55%,#5E1640 100%);box-shadow:0 14px 30px rgba(94,22,64,.32);text-align:left}
.cartbar small{display:block;font-size:12px;color:#FFE3EE}
.cartbar b{font-size:17px}
.cartbar em{font-style:normal;font-size:15px;font-weight:800}

/* overlay sheet */
.ov{position:absolute;inset:0;z-index:50;background:rgba(28,13,31,.5);display:flex;align-items:flex-end;animation:fade .2s}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 18px 24px;box-shadow:0 -20px 50px rgba(28,13,31,.35);animation:up .28s cubic-bezier(.2,.8,.2,1);position:relative}
.sheet .grab{display:block;margin:0 auto 10px;width:44px;height:5px;border-radius:3px;background:#E3D2DA}
.sheet .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:18px;border:0;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:center}
.sheet .x svg{width:18px;height:18px}
@keyframes up{from{transform:translateY(60%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.big{height:200px;border-radius:24px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.big .ill{width:130px;height:130px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;color:#fff;font-size:16px;font-weight:800;padding:15px;border-radius:14px;text-decoration:none;background:linear-gradient(135deg,#C93A72 0%,#A62A62 50%,#7A1D4E 100%);box-shadow:0 10px 22px rgba(122,29,78,.25)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:none;border:1px solid #E6DCE6}
.btn.green{background:linear-gradient(135deg,#4E9A78,#2F6E52);box-shadow:0 10px 22px rgba(47,110,82,.22)}
.btn svg{width:20px;height:20px}
.btn[disabled]{opacity:.5}
.promise{display:flex;align-items:center;gap:8px;background:#F8EEF3;color:#7A1D4E;border-radius:14px;padding:10px 12px;font-size:12.5px;font-weight:600;line-height:1.35}
.promise svg{width:18px;height:18px;flex-shrink:0}

/* cards */
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 6px 16px rgba(34,20,31,.05)}
.line{display:flex;align-items:center;gap:10px;padding:8px 0}
.line+.line{border-top:1px solid #F3ECF1}
.line .th{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.line .th .ill{width:40px;height:40px}
.grow{flex:1;min-width:0}
.mut{color:var(--muted);font-size:12.5px}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:4px 0}
.sum.tot{border-top:1px dashed #E6DCE6;margin-top:6px;padding-top:10px;font-size:16px;font-weight:800}
.radio{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid #EDE3EB;background:#fff;width:100%;text-align:left;color:var(--ink)}
.radio.on{border:2px solid var(--a);background:#FFF5F9}
.radio i{width:20px;height:20px;border-radius:50%;border:2px solid #D6BFCB;flex-shrink:0}
.radio.on i{border:6px solid var(--a)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13.5px;font-weight:700}
.field input{height:50px;border:1px solid #E6DCE6;border-radius:14px;padding:0 14px;font-size:16px;font-weight:400;background:#fff;color:var(--ink);outline:0}
.field input:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(214,36,110,.15)}
.otp{display:flex;gap:12px}
.otp input{width:56px;height:60px;text-align:center;font-size:24px;font-weight:800;border:1.5px solid #E6DCE6;border-radius:14px;background:#fff;outline:0;color:var(--ink)}
.otp input:focus{border-color:var(--a)}
.tagc{padding:8px 12px;border-radius:12px;border:1px dashed #E3C3D2;background:#fff;font-size:13px;color:var(--ink)}
.tagc.on{border:1.5px solid var(--a);background:var(--soft);color:var(--deep);font-weight:700}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);z-index:70;background:rgba(28,13,31,.88);color:#fff;font-size:13px;padding:10px 16px;border-radius:12px;max-width:86%;text-align:center;animation:fade .2s;backdrop-filter:blur(8px)}

/* hero (lang/login) */
.hero{position:relative;color:#fff;background:var(--head);padding:58px 24px 34px;border-radius:0 0 34px 34px;overflow:hidden;flex-shrink:0}
.hero .orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.brand{position:relative;display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;letter-spacing:-.5px}
.hero h1{position:relative;margin:18px 0 6px;font-size:24px;line-height:1.3}
.hero p{position:relative;margin:0;font-size:15px;color:#FFE3EE;line-height:1.45}
.langb{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;border:1px solid #E9DFE8;background:#fff;width:100%;text-align:left;color:var(--ink)}
.langb.on{border:2px solid var(--a);background:#FFF5F9}
.langb .m{width:46px;height:46px;border-radius:23px;background:var(--soft);color:var(--a);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.langb b{display:block;font-size:18px}
.langb small{font-size:13px;color:var(--muted)}

/* track */
.map{position:relative;height:440px;flex-shrink:0;background:#E9EFE4}
.map>svg{position:absolute;inset:0;width:100%;height:100%}
.map .ctl{position:absolute;top:36px;left:14px;right:14px;display:flex;gap:10px;align-items:center}
.map .ctl button{width:42px;height:42px;border-radius:21px;border:0;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.map .ctl svg{width:20px;height:20px}
.map .ctl span{background:#fff;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.tsheet{position:relative;margin-top:-34px;background:var(--bg);border-radius:30px 30px 0 0;padding:10px 16px 30px;display:flex;flex-direction:column;gap:14px;box-shadow:0 -16px 40px rgba(28,13,31,.16)}
.steps{display:flex;align-items:flex-start}
.steps div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:10.5px;text-align:center;line-height:1.25;color:var(--muted)}
.steps div::before{content:"";position:absolute;top:11px;left:50%;width:100%;height:4px;background:#E6DCE6}
.steps div:last-child::before{display:none}
.steps div.done::before{background:#4E9A78}
.steps i{position:relative;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #E6DCE6;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:13px;font-weight:800}
.steps .done i{background:#4E9A78;border-color:#4E9A78}
.steps .now i{background:#E5A447;border-color:#F6E3C2;animation:pulse 1.2s infinite}
.steps .done,.steps .now{color:var(--ink);font-weight:700}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,176,32,.25)}}
.code{display:flex;gap:6px}
.code span{width:34px;height:40px;border-radius:10px;background:#FFF0F5;border:1.5px solid #F6C3D6;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#A3164F}
.menu{display:flex;align-items:center;gap:12px;padding:14px;border:0;background:none;width:100%;text-align:left;color:var(--ink);font-size:15px;font-weight:600;text-decoration:none}
.menu+.menu{border-top:1px solid #F3ECF1}
.menu .mi{width:38px;height:38px;border-radius:12px;background:var(--soft);color:var(--a);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu .mi svg{width:20px;height:20px}
.menu .chev{color:#C9B6C2}
.seg{display:flex;background:#F1E8EF;border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button.on{background:#fff;color:var(--a);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.st{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.empty{text-align:center;padding:40px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ill{width:120px;height:120px}
</style>

var trackTimer=null;
function tickTrack(id){
  clearInterval(trackTimer);
  var path = document.getElementById('rt'); if (!path) return;
  var o=null; for (var i=0;i<S.orders.length;i++) if (S.orders[i].id===id) o=S.orders[i]; if (!o) o=S.orders[0]; if (!o) return;
  var len = path.getTotalLength();
  function upd(){
    var T=t(), st=orderStep(o), el=Date.now()-o.t0;
    var p = st<3 ? 0 : st>=4 ? 1 : Math.min(1,(el-18000)/6000);
    var pt = path.getPointAtLength(len*p), r=document.getElementById('rider');
    if (r) r.setAttribute('transform','translate('+pt.x.toFixed(1)+' '+pt.y.toFixed(1)+')');
    var ds = document.querySelectorAll('#steps div');
    for (var k=0;k<ds.length;k++){ ds[k].className = k<st || st===4 ? 'done' : (k===st?'now':''); ds[k].querySelector('i').textContent = (k<st||st===4)?'✓':''; }
    var mins = Math.max(1, Math.round(30 - 30*(el/24000)));
    document.getElementById('tv').textContent = st===4 ? T.delivered : mins+' '+T.minutes;
    document.getElementById('tk').style.visibility = st===4 ? 'hidden':'visible';
    var tsEl=document.getElementById('ts'); tsEl.textContent = T.statusT[st];
    tsEl.style.background = st===0 ? '#F8EEF3' : '#EAF3EE'; tsEl.style.color = st===0 ? '#7A1D4E' : '#2F6E52';
    if (st===4) clearInterval(trackTimer);
  }
  upd(); trackTimer = setInterval(upd, 300);
}

function bindInputs(r){
  var ph=document.getElementById('ph');
  if (ph) ph.addEventListener('input', function(){ ph.value=ph.value.replace(/\D/g,'').slice(0,10); S.phone=ph.value; document.getElementById('sendotp').disabled = S.phone.length!==10; });
  var os=document.querySelectorAll('[data-otp]');
  if (os.length){ os[0].focus(); for (var i=0;i<os.length;i++) (function(i){
    os[i].addEventListener('input', function(){ os[i].value=os[i].value.replace(/\D/g,'').slice(0,1); if (os[i].value && os[i+1]) os[i+1].focus(); var all=''; for (var k=0;k<os.length;k++) all+=os[k].value; document.getElementById('verify').disabled = all.length!==4; });
    os[i].addEventListener('keydown', function(e){ if (e.key==='Backspace' && !os[i].value && os[i-1]) os[i-1].focus(); });
  })(i); }
  var hs=document.getElementById('house'); if (hs) hs.addEventListener('input', function(){ S.addr.house=hs.value; });
}

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-go],[data-back],[data-tab],[data-shop],[data-item],[data-q],[data-close],[data-cat],[data-cat2],[data-filter],[data-lang],[data-lang2],[data-book],[data-note],[data-tag],[data-pay],[data-about],[data-logout],#sendotp,#verify,#saveaddr,#place');
  if (!el) return;
  var d = el.dataset;
  if (d.close !== undefined && el.classList.contains('ov') && e.target !== el) return;
  if (d.q){ e.stopPropagation(); setQty(d.q, +d.d); render(true); return; }
  if (d.close){ S.sheet=null; render(true); return; }
  if (d.go){ S.sheet=null; go(d.go); return; }
  if (d.back){ if (history.length>1) history.back(); else go(d.back); return; }
  if (d.tab){ switchTab(+d.tab); return; }
  if (d.shop){ go('shop-'+d.shop); return; }
  if (d.item){ S.sheet={type:'item',id:d.item}; render(true); return; }
  if (d.book){ S.sheet={type:'book',id:+d.book}; render(true); return; }
  if (d.cat){ S.cat=d.cat; go('cats'); return; }
  if (d.cat2){ S.cat=d.cat2; render(true); return; }
  if (d.filter){ S.filter=+d.filter; render(true); return; }
  if (d.lang){ S.lang=d.lang; save(); render(); return; }
  if (d.lang2){ S.lang=d.lang2; save(); render(true); return; }
  if (d.note){ var n=+d.note, a=S.addr.note, ix=a.indexOf(n); if (ix>=0) a.splice(ix,1); else a.push(n); render(true); return; }
  if (d.tag){ S.addr.tag=+d.tag; render(true); return; }
  if (d.pay){ S.pay=+d.pay; save(); render(true); return; }
  if (d.about){ toast(t().aboutS); return; }
  if (d.logout){ var l=S.lang; try{localStorage.removeItem('mk_trial');}catch(x){} S={lang:l,tab:0,cat:null,filter:0,cart:{shop:null,q:{}},orders:[],phone:'',addr:{tag:0,note:[],house:''},pay:0,loggedIn:false,sheet:null}; go('lang'); return; }
  if (el.id==='sendotp'){ go('otp'); return; }
  if (el.id==='verify'){ S.loggedIn=true; save(); go('addr'); return; }
  if (el.id==='saveaddr'){ S.loggedIn=true; save(); go('home'); return; }
  if (el.id==='place'){
    var id = String(1000 + Math.floor(Math.random()*9000)), code = String(1000+Math.floor(Math.random()*9000));
    S.orders.unshift({id:id, shop:S.cart.shop, n:cartCount(), total:cartTotal(), t0:Date.now(), code:code});
    S.cart={shop:null,q:{}}; save(); go('track-'+id); return;
  }
});

var tx=null, ty=null;
document.addEventListener('touchstart', function(e){ if (route()!=='home' || !e.target.closest('#hbody')) { tx=null; return; } tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
document.addEventListener('touchend', function(e){ if (tx===null) return; var dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty; tx=null; if (Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*1.5){ var n=S.tab+(dx<0?1:-1); if (n>=0 && n<4) switchTab(n); } }, {passive:true});

if (!location.hash) history.replaceState(null,'','#'+route());
render();
window.MK_BACK = function(){ if (S.sheet){ S.sheet=null; render(true); return true; } var r=route(); if (r==='home'||r==='lang') return false; history.back(); return true; };
})();
</script>
</body>
