<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maakit Library · Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--ink:#1f1a2e;--mut:#6f6a7d;--line:#ebe7f0;--bg:#f4f3f8;--card:#fff;--brand:#c2185b;--brand2:#f39c12;--ok:#12a150;--okbg:#e3f6ea;--warn:#b7791f;--warnbg:#fdf2dc;--bad:#d93a4b;--badbg:#fde6e8;--tab:#c2185b;--tabbg:#fbe9f0;--sh:0 1px 2px rgba(31,26,46,.04),0 6px 18px rgba(31,26,46,.06);--r:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 Inter,"Noto Sans Devanagari",system-ui,sans-serif}
body.hi{font-family:"Noto Sans Devanagari",Inter,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:flex;min-height:100vh}
nav{width:244px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px}
.bn{font-weight:600;font-size:14px;line-height:1.25}
.bs{font-size:11px;color:var(--mut)}
.nb{display:flex;gap:11px;align-items:center;width:100%;text-align:left;background:none;border:none;color:var(--ink);padding:9px 10px;border-radius:11px;cursor:pointer;margin-bottom:2px;font-weight:500}
.nb .ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c)}
.nb:hover{background:#f6f4f9}
.nb.on{background:color-mix(in srgb,var(--c) 10%,#fff);color:var(--c)}
.nb.on .ico{background:var(--c);color:#fff}
.nb .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:600;border-radius:999px;padding:0 7px;line-height:18px}
.lang{margin-top:auto;padding:12px 6px 4px;border-top:1px solid var(--line)}
.seg{display:flex;background:#f3f1f7;border-radius:10px;padding:3px}
.seg button{flex:1;border:none;background:none;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
main{flex:1;min-width:0;padding:22px 28px 96px}
.ph{background:linear-gradient(120deg,var(--tab),color-mix(in srgb,var(--tab) 60%,#fff));color:#fff;border-radius:var(--r);padding:18px 22px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph .pi{width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.ph .pi svg{width:22px;height:22px}
.ph h1{font-size:21px;font-weight:700;margin:0;letter-spacing:-.01em}
.ph p{margin:2px 0 0;opacity:.9;font-size:13px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.ph .btn{background:#fff;color:var(--tab);box-shadow:none}
.ph .btn.gh{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4)}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
.card{background:var(--card);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card.tight{padding:4px 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.tile{background:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh);border-top:4px solid var(--tc,#7b5cff)}
.tile .l{font-size:12px;color:var(--mut);font-weight:500;display:flex;gap:6px;align-items:center}
.tile .l svg{width:15px;height:15px;color:var(--tc)}
.tile .n{font-size:24px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.tile .h{font-size:12px;color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:11px;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--tab);color:#fff;white-space:nowrap;text-decoration:none;box-shadow:0 2px 8px color-mix(in srgb,var(--tab) 30%,transparent)}
.btn svg{width:16px;height:16px}
.btn:hover{filter:brightness(1.07)}
.btn.s{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.s:hover{background:#f7f5fa;filter:none}
.btn.ok{background:var(--ok);box-shadow:0 2px 8px rgba(18,161,80,.25)}
.btn.wa{background:#1fae54;box-shadow:0 2px 8px rgba(31,174,84,.25)}
.btn.x{background:none;color:var(--mut);box-shadow:none;padding:6px 8px}
.btn.sm{padding:5px 11px;font-size:12px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--tab)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 4px}
.f{margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.err{color:var(--bad);font-size:12px;min-height:16px}
.hint{font-size:12px;color:var(--mut)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
body.hi th{text-transform:none;letter-spacing:0;font-size:12px}
td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
.tw{overflow-x:auto}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.due{background:var(--badbg);color:var(--bad)}.pill.soon{background:var(--warnbg);color:var(--warn)}.pill.off{background:#eeedf2;color:#76727f}.pill.new{background:#ebe5ff;color:#5b3fd1}
.mut{color:var(--mut)}.small{font-size:12px}.b{font-weight:600}
a.lk{color:var(--ink);font-weight:600;text-decoration:none}
a.lk:hover{color:var(--tab)}
.empty{text-align:center;padding:34px 16px;color:var(--mut)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;background:#fff;padding:4px;border-radius:12px;box-shadow:var(--sh);width:fit-content;max-width:100%}
.tabs button{border:none;background:none;border-radius:9px;padding:7px 14px;cursor:pointer;font-size:13px;font-weight:500;color:var(--mut)}
.tabs button.on{background:var(--tab);color:#fff}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:9px}
.seat{border-radius:12px;padding:9px 4px;text-align:center;cursor:pointer;min-height:62px;border:1.5px solid}
.seat b{display:block;font-size:15px}
.seat span{font-size:10px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat.free{background:#f1fbf5;border-color:#bfe8cf;color:#0e7a3e}
.seat.busy{background:#eef1fd;border-color:#c4cdf6;color:#3446a8}
.seat.busy.due{background:#fdeef0;border-color:#f3c0c6;color:var(--bad)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.ov{position:fixed;inset:0;background:rgba(31,26,46,.45);display:none;align-items:flex-start;justify-content:center;padding:28px 12px;overflow:auto;z-index:20}
.ov.on{display:flex}
.modal{background:#fff;border-radius:20px;width:min(640px,100%);padding:22px;box-shadow:0 20px 60px rgba(31,26,46,.25)}
.modal h3{font-size:19px;font-weight:700;margin:0 0 14px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:11px;z-index:30;display:none;max-width:90vw}
.months{display:flex;gap:6px;flex-wrap:wrap}
.mchk{display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--mut);cursor:pointer;gap:2px}
.mchk input{width:18px;height:18px;accent-color:var(--ok);cursor:pointer}
.receipt{background:#fbfaf7;border:1.5px dashed #ddd5c4;border-radius:12px;padding:14px;white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:13px}
.qr{display:inline-block;background:#fff;padding:10px;border-radius:12px;border:1px solid var(--line)}
.qr img,.qr canvas{display:block}
.dots{display:flex;gap:3px}
.dot{width:12px;height:12px;border-radius:3px;background:#ebe8f0}
.dot.p{background:var(--ok)}
.notice{background:#fff8e8;border:1px solid #f4e2b6;color:#7a5410;padding:10px 14px;border-radius:12px;font-size:13px;margin-bottom:14px}
.chip{display:inline-block;background:#f3f1f7;border-radius:6px;padding:1px 7px;font-size:12px;font-family:ui-monospace,monospace}
.steps{display:grid;gap:10px;counter-reset:s}
.step{display:flex;gap:12px;align-items:flex-start}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--tab);color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0;font-size:13px}
.check{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.check .ck{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:#eeedf2;color:#fff}
.check.done .ck{background:var(--ok)}
.check.done .t{color:var(--mut);text-decoration:line-through}
.bar{height:8px;background:#eeedf2;border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);border-radius:99px}
.phone{width:min(340px,100%);border-radius:34px;background:#fff;box-shadow:0 20px 50px rgba(31,26,46,.18);overflow:hidden;border:8px solid #1f1a2e;margin:0 auto}
.phone .pt{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:22px 18px 30px}
.phone .pt h4{font-size:19px;margin:4px 0 2px}
.phone .pb{padding:0 14px 16px;margin-top:-18px}
.phone .pc{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:12px 14px;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:10px}
.cal div{padding:4px 0;border-radius:6px;background:#f3f1f7;color:var(--mut)}
.cal div.p{background:var(--ok);color:#fff}
.cal div.x{background:transparent}
.big{font-size:24px;font-weight:700}
.chartbox{position:relative;height:250px}
.kiosk{min-height:100vh;background:linear-gradient(135deg,#0f8f8f,#12a150);display:flex;align-items:center;justify-content:center;padding:20px}
.kiosk .card{max-width:420px;width:100%;text-align:center;padding:26px}
.poster{border:2px dashed #b9e2dd;border-radius:16px;padding:16px;text-align:center;background:#f4fbfa}
.poster h3{margin:0 0 4px;font-size:17px}
.center{text-align:center}
@media(max-width:860px){
 .app{display:block}
 nav{position:fixed;bottom:0;top:auto;left:0;right:0;width:auto;height:auto;padding:6px;display:flex;flex-direction:row;z-index:10;overflow-x:auto;border-right:none;border-top:1px solid var(--line)}
 .brand,.lang{display:none}
 .nb{flex-direction:column;gap:2px;font-size:10px;padding:4px;justify-content:center;margin:0;min-width:66px;position:relative;text-align:center}
 .nb .cnt{position:absolute;top:0;right:8px;font-size:9px;line-height:15px}
 main{padding:14px 12px 100px}
 .toast{bottom:86px}
 .g2,.g3{grid-template-columns:1fr}
 .ph .acts{margin-left:0}
 .mlang{display:block!important}
}
.mlang{display:none;margin-bottom:12px}
</style>
</head>

const S = { settings: null, plans: [], students: [], payments: [], expenses: [], joins: [], attendance: [] };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const Store = {
  async setSettings(d) { S.settings = d; refresh(); },
  async add(c, d) { const x = Object.assign({ id: uid() }, d); S[c].push(x); refresh(); return x; },
  async update(c, id, d) { Object.assign(S[c].find((x) => x.id === id), d); refresh(); },
  async remove(c, id) { S[c] = S[c].filter((x) => x.id !== id); refresh(); }
};

const mon = (s) => { const d = parse(s); return d ? d.toLocaleDateString(loc(), { month: 'short', year: '2-digit' }) : ''; };
const addMonths = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth() + n, 1); const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate(); x.setDate(Math.min(d.getDate(), last)); return x; };
const daysBetween = (a, b) => Math.round((b - a) / 86400000);

/* Fees */
function cycles(st) { const j = parse(st.joinDate); if (!j) return []; const out = [], t = st.left && st.leftOn ? parse(st.leftOn) : today(); for (let i = 0; i < 120; i++) { const d = addMonths(j, i); if (d > t && i > 0) break; out.push(iso(d)); } return out; }
function paidSet(st) { const s = new Set(); S.payments.forEach((p) => { if (p.studentId === st.id) (p.cycles || []).forEach((c) => s.add(c)); }); return s; }
function feeInfo(st) {
  const cs = cycles(st), paid = paidSet(st), t = today(), dueCycles = cs.filter((c) => !paid.has(c));
  let next = null; for (let i = 0; i < 240; i++) { const c = iso(addMonths(parse(st.joinDate), i)); if (!paid.has(c)) { next = c; break; } }
  const amount = dueCycles.length * monthly(st);
  let status = 'ok'; if (st.left) status = 'off'; else if (dueCycles.length) status = 'due'; else if (next && daysBetween(t, parse(next)) <= 3) status = 'soon';
  return { dueCycles, next, amount, status };
}
const ST_LABEL = () => ({ ok: T('Paid'), due: T('Fee due'), soon: T('Due soon'), off: T('Left') });
const tpl = (k) => (S.settings?.templates || {})[k] || TPL[lang][k];
function fill(t, st, extra = {}) { const fi = feeInfo(st), p = planOf(st.planId); const v = Object.assign({ name: st.name, library: S.settings?.name || 'Library', amount: rs(fi.amount), months: fi.dueCycles.length, date: fmt(fi.next), seat: st.seat || '—', shift: pName(p), fee: rs(monthly(st)), upi: S.settings?.upi || '—' }, extra); return t.replace(/\{(\w+)\}/g, (m, k) => v[k] ?? m); }
const remindText = (s, i) => fill(tpl(i.status === 'due' ? 'reminder' : 'soon'), s, i.status === 'due' ? {} : { amount: rs(monthly(s)) });

  m.innerHTML = head('cog', T('Settings'), S.settings.name) + tabsBar([['profile', T('Library Profile')], ['plans', T('Shifts & Fees')], ['seats', T('Seats & Lockers')], ['pay', T('Payments')], ['tpl', T('Message Templates')], ['lang', T('Language')], ['terms', T('Terms & Conditions')]], tab) + '<div id="tb"></div>';
  bindTabs(m);
  const tb = $('#tb'), st = S.settings, saveS = (d) => safe(() => Store.setSettings(Object.assign({}, st, d)), T('Saved'));
  if (tab === 'profile') {
    tb.innerHTML = `<div class="card"><div class="g2"><div class="f"><label>${T('Library name')}</label><input id="a1" value="${esc(st.name)}"></div><div class="f"><label>${T('Owner name')}</label><input id="a2" value="${esc(st.owner)}"></div></div><div class="g3"><div class="f"><label>${T('Mobile')}</label><input id="a3" value="${esc(st.phone)}" maxlength="10"></div><div class="f"><label>${T('Library ID')}</label><input id="a4" value="${esc(st.code || '')}"></div><div class="f"><label>${T('Change PIN')} <span class="mut">(${T('leave blank to keep')})</span></label><input id="a5" maxlength="4" inputmode="numeric"></div></div><div class="f"><label>${T('Notice on student app')}</label><input id="a6" value="${esc(st.notice || '')}"></div><div class="err" id="aE"></div><button class="btn" id="aS">${T('Save')}</button></div>`;
    $('#aS').onclick = () => { const d = { name: $('#a1').value.trim(), owner: $('#a2').value.trim(), phone: cleanPhone($('#a3').value), code: $('#a4').value.trim().toUpperCase(), notice: $('#a6').value.trim() }, pin = $('#a5').value.trim(); if (!d.name) { $('#aE').textContent = T('Enter the name'); return; } if (!phoneOk(d.phone)) { $('#aE').textContent = T('Enter a valid 10-digit mobile number'); return; } if (pin) d.pin = pin; saveS(d); };
  }
  if (tab === 'plans') {
    tb.innerHTML = `<div class="card"><p class="hint" style="margin-top:0">${T('Each shift has its own timing and monthly fee. The same seat can go to different students in different shifts if timings do not overlap.')}</p>${S.plans.length ? `<table><tr><th>${T('Shift name')}</th><th>${T('Timing')}</th><th>${T('Hours')}</th><th>${T('Fee per month (₹)')}</th><th>${T('Students')}</th><th></th></tr>${S.plans.map((p) => { const n = S.students.filter((s) => !s.left && s.planId === p.id).length; let h = (toMin(p.end) - toMin(p.start)) / 60; if (h <= 0) h += 24; return `<tr><td class="b">${esc(pName(p))}</td><td>${t12(p.start)} – ${t12(p.end)}</td><td>${h}</td><td>${rs(p.fee)}</td><td>${n}</td><td style="text-align:right;white-space:nowrap"><button class="btn x sm" data-ep="${p.id}">${T('Edit')}</button>${n ? '' : ` <button class="btn x sm" data-dp="${p.id}">${T('Remove')}</button>`}</td></tr>`; }).join('')}</table>` : `<div class="empty"><b>${T('No shifts yet')}</b></div>`}<div class="row" style="margin-top:12px"><button class="btn" id="npl">${I('plus')}${T('Add Shift')}</button></div></div>`;
    $('#npl').onclick = () => planForm();
    tb.querySelectorAll('[data-ep]').forEach((b) => b.onclick = () => planForm(b.dataset.ep));
    tb.querySelectorAll('[data-dp]').forEach((b) => b.onclick = () => confirmBtn(b, () => safe(() => Store.remove('plans', b.dataset.dp), T('Saved'))));
  }
  if (tab === 'seats') {
    const maxSeat = Math.max(0, ...S.students.filter((s) => !s.left && s.seat).map((s) => +s.seat));
    tb.innerHTML = `<div class="card"><div class="g2"><div class="f"><label>${T('Total seats')}</label><input id="b1" type="number" value="${st.seats}"></div><div class="f"><label>${T('Locker fee per month (₹)')}</label><input id="b2" type="number" value="${st.lockerFee || 0}"></div></div><div class="err" id="bE"></div><button class="btn" id="bS">${T('Save')}</button></div>`;
    $('#bS').onclick = () => { const n = +$('#b1').value; if (!(n > 0) || n < maxSeat) { $('#bE').textContent = T('Seats cannot be fewer than an occupied seat number') + ' (' + maxSeat + ')'; return; } saveS({ seats: n, lockerFee: +$('#b2').value || 0 }); };
  }
  if (tab === 'pay') {
    tb.innerHTML = `<div class="g2"><div class="card"><div class="f"><label>${T('UPI ID')}</label><input id="c1" value="${esc(st.upi || '')}" placeholder="name@ybl"><div class="hint">${T('Shown as QR while collecting fees and in student app.')}</div></div><div class="f"><label>${T('Admission fee')} (₹)</label><input id="c2" type="number" value="${st.admissionFee || 0}"><div class="hint">${T('Charged once to new students. 0 = none.')}</div></div><button class="btn" id="cS">${T('Save')}</button></div><div class="card center"><div class="qr" id="upiQr"></div><div class="hint" style="margin-top:6px">${esc(st.upi || '')}</div></div></div>`;
    drawQR($('#upiQr'), upiLink('', 'Library fee'), 150);
    $('#cS').onclick = () => saveS({ upi: $('#c1').value.trim(), admissionFee: +$('#c2').value || 0 });
  }
  if (tab === 'tpl') {
    const names = { reminder: T('Fee reminder'), soon: T('Upcoming fee'), receipt: T('Receipt'), welcome: T('Welcome message'), absent: T('Absence check'), notice: T('Notice prefix') };
    tb.innerHTML = `<div class="card"><p class="hint" style="margin-top:0">${T('These words fill in automatically:')} ${['name', 'library', 'amount', 'months', 'date', 'seat', 'shift', 'fee', 'upi'].map((x) => `<span class="chip">{${x}}</span>`).join(' ')}</p>${Object.keys(TPL.en).map((k) => `<div class="f"><label>${names[k]}</label><textarea id="tp_${k}" style="min-height:60px">${esc(tpl(k))}</textarea></div>`).join('')}<button class="btn" id="tpS">${T('Save')}</button> <button class="btn s" id="tpR">${T('Restore defaults')}</button></div>`;
    $('#tpS').onclick = () => { const o = {}; Object.keys(TPL.en).forEach((k) => { const v = $('#tp_' + k).value; if (v !== TPL[lang][k]) o[k] = v; }); saveS({ templates: o }); };
    $('#tpR').onclick = () => saveS({ templates: {} });
  }
  if (tab === 'terms') { tb.innerHTML = `<div class="card"><ol style="padding-left:20px;margin:0">${[1, 2, 3, 4, 5, 6, 7].map((n) => `<li style="margin-bottom:8px">${T('term' + n)}</li>`).join('')}</ol><div style="margin-top:10px">${st.termsAt ? `<span class="pill ok">✓ ${T('Accepted on')} ${fmt(st.termsAt)}</span>` : `<button class="btn" data-terms="1">${T('I accept the terms')}</button>`}</div></div>`; bindCommon(tb); }
  if (tab === 'lang') {
    tb.innerHTML = `<div class="card" style="max-width:420px"><label>${T('App language')}</label>${langSeg()}<p class="hint">${T('Messages to students also follow this language unless you edit them.')}</p></div>`;
    tb.querySelectorAll('[data-lang]').forEach((b) => b.onclick = () => setLang(b.dataset.lang));
  }
}
function planForm(id) {
  const p = id ? planOf(id) : { name: '', start: '06:00', end: '12:00', fee: '' };
  modal(`<h3>${id ? T('Edit') : T('Add Shift')}</h3><div class="f"><label>${T('Shift name')} *</label><input id="plN" value="${esc(p.name)}" placeholder="Morning, Evening, Night, Full day"></div><div class="g3"><div class="f"><label>${T('Start')}</label><input id="plS" type="time" value="${p.start}"></div><div class="f"><label>${T('End')}</label><input id="plE" type="time" value="${p.end}"></div><div class="f"><label>${T('Fee per month (₹)')} *</label><input id="plF" type="number" value="${p.fee}"></div></div>${id ? `<p class="hint">${T('Changing the fee does not change existing students\' fees.')}</p>` : ''}<div class="err" id="plErr"></div><div class="mf"><button class="btn s" id="plC">${T('Cancel')}</button><button class="btn" id="plOk">${T('Save')}</button></div>`);
  $('#plC').onclick = closeModal;
  $('#plOk').onclick = async () => { const d = { name: $('#plN').value.trim(), start: $('#plS').value, end: $('#plE').value, fee: +$('#plF').value }; const e = !d.name ? T('Enter the name') : !d.start || !d.end || d.start === d.end ? T('Pick a valid timing') : !(d.fee > 0) ? T('Enter the fee') : S.plans.some((x) => x.name.toLowerCase() === d.name.toLowerCase() && x.id !== id) ? T('A shift with this name exists') : ''; if (e) { $('#plErr').textContent = e; return; } if (await safe(() => id ? Store.update('plans', id, d) : Store.add('plans', d), T('Shift saved'))) closeModal(); };
}

  S.students = []; S.payments = []; S.attendance = [];
  spec.forEach(([pl, seat, mAgo, dd, unpaid], i) => {
    const plan = S.plans.find((p) => p.id === pl), lk = i % 5 === 1 ? 'L-' + (i + 1) : '';

    S.students.push(st);
    const cs = cycles(st); cs.slice(0, Math.max(0, cs.length - unpaid)).forEach((c, n) => S.payments.push({ id: id(), studentId: st.id, cycles: [c], amount: plan.fee + (lk ? 100 : 0) + (n === 0 ? 200 : 0), admission: n === 0 ? 200 : 0, date: c, mode: n % 3 === 0 ? 'Cash' : 'UPI' }));
  });

  [0, -1, -2, -3, -4, -5].forEach((mm) => { const dt = iso(new Date(t.getFullYear(), t.getMonth() + mm, 5)); S.expenses.push({ id: id(), what: 'Rent', amount: 4000, date: dt }, { id: id(), what: 'Electricity', amount: 1100 - 100 * mm, date: dt }, { id: id(), what: 'Internet', amount: 600, date: dt }); });
  S.expenses.push({ id: id(), what: 'Repairs', note: '2 chairs', amount: 600, date: d(-6) });
  let r = 7; const rnd = () => (r = (r * 9301 + 49297) % 233280) / 233280, hm = (x) => pad(Math.floor(x / 60)) + ':' + pad(x % 60);
